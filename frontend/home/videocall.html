<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CFS-Admin · Videoconferencia</title>
<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="videocall.css">
</head>
<body>
<div class="video-container">
  <!-- Video remoto (pantalla principal) -->
  <div class="video-wrapper remote-wrapper">
    <video id="remote-video" autoplay playsinline></video>
    <div class="video-placeholder" id="remote-placeholder">
      <div class="placeholder-avatar">👤</div>
      <h3 id="remote-user-name">Esperando conexión…</h3>
      <p id="call-status-text">Conectando señalización WebRTC en tu sede…</p>
    </div>
  </div>

  <!-- Video local (miniatura PiP) -->
  <div class="video-wrapper local-wrapper" id="local-wrapper">
    <video id="local-video" autoplay playsinline muted></video>
    <div class="video-label">Tú</div>
  </div>

  <!-- Barra de información superior -->
  <header class="call-top-bar">
    <div class="call-room-info">
      <span class="mark">CFS</span>
      <div>
        <h2 id="call-title">Videoconferencia Intra-Sede</h2>
        <span class="call-meta" id="call-room-code">Sala: Conectando…</span>
      </div>
    </div>
    <div class="call-top-actions">
      <button class="ghost btn-copy-room" id="btn-copiar-sala" type="button" title="Copiar código de sala">📋 Copiar Sala</button>
    </div>
  </header>

  <!-- Notificación de estado -->
  <div class="call-alert" id="call-alert" hidden></div>

  <!-- Barra de controles multimedia flotante inferior -->
  <nav class="call-controls" aria-label="Controles de videollamada">
    <button class="control-btn" id="btn-toggle-mic" type="button" title="Silenciar / Activar micrófono" aria-label="Micrófono">
      <span class="icon">🎤</span>
      <span class="lbl">Micrófono</span>
    </button>

    <button class="control-btn" id="btn-toggle-cam" type="button" title="Apagar / Encender cámara" aria-label="Cámara">
      <span class="icon">📹</span>
      <span class="lbl">Cámara</span>
    </button>

    <button class="control-btn danger" id="btn-colgar" type="button" title="Finalizar llamada" aria-label="Finalizar llamada">
      <span class="icon">📞</span>
      <span class="lbl">Finalizar</span>
    </button>
  </nav>
</div>

<script type="module" src="videocall.js"></script>
</body>
</html>
